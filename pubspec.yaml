name: netmix_flutter
description: Netmix — Android streaming client for the Netmix platform.
publish_to: 'none'
version: 1.0.2+2020

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.8.1

  # HTTP
  dio: ^5.7.0

  # Video player (HLS adaptive bitrate + media controls)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.3.2
  media_kit_libs_ios_video: ^1.1.4

  # Image caching + shimmer
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Downloads
  flutter_downloader: ^1.11.8

  # Wakelock
  wakelock_plus: ^1.2.10

  # Permissions
  permission_handler: ^11.3.1
  package_info_plus: ^8.1.0

  # Utils
  intl: ^0.19.0
  collection: ^1.19.1
  equatable: ^2.0.7
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10

  # Liquid Glass UI
  liquid_glass_widgets: ^1.16.0
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  video_player: ^2.14.1
  screen_brightness: ^2.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
